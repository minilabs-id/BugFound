name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Audit dependencies
        uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

      - name: Enforce ADR-001 kernel boundary
        shell: bash
        run: |
          if git grep -n -I -i -E 'finding|bounty|wstg|cvss|cwe|scope_summary|persist_bounty_tool_result|prioritize_targets|agentbug_engagement|agentbug_domain' -- crates/agentbug-core/src; then
            echo "ADR-001: agentbug-core contains domain vocabulary"
            exit 1
          fi
          if cargo tree -p agentbug-core -e normal --prefix none --depth 1 | grep -E 'agentbug-(engagement|domain)'; then
            echo "ADR-001: agentbug-core depends on a domain crate"
            exit 1
          fi

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release --workspace
