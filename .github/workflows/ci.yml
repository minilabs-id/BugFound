name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      # bugfound-app is a Tauri shell; on Linux its webkit2gtk-sys build script
      # probes system packages via pkg-config. Without these, every workspace
      # check fails on ubuntu-latest even though the agent crates are fine.
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Audit dependencies
        # Pin the tool so a newer release's schema/config changes cannot
        # silently alter deny.toml behavior (audit F16).
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.18.5
      - run: cargo deny check

      - name: Enforce ADR-001 kernel boundary
        shell: bash
        run: |
          if git grep -n -I -i -E 'finding|bounty|wstg|cvss|cwe|scope_summary|persist_bounty_tool_result|prioritize_targets|bugfound_engagement|bugfound_domain' -- crates/bugfound-core/src; then
            echo "ADR-001: bugfound-core contains domain vocabulary"
            exit 1
          fi
          if cargo tree -p bugfound-core -e normal --prefix none --depth 1 | grep -E 'bugfound-(engagement|domain)'; then
            echo "ADR-001: bugfound-core depends on a domain crate"
            exit 1
          fi

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release --workspace
