[workspace]
resolver = "2"
members = [
  "crates/agentbug-core",
  "crates/agentbug-kernel-traits",
  "crates/agentbug-llm",
  "crates/agentbug-tools",
  "crates/agentbug-policy",
  "crates/agentbug-store",
  "crates/agentbug-cli",
  "crates/agentbug-desktop",
  "crates/agentbug-engagement",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
futures = "0.3"
url = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
sha2 = "0.10"
eframe = "0.31"
egui = "0.31"
base64 = "0.22"
regex = "1"
